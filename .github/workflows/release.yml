name: Build and release native bindings

on:
  push:
    tags:
      - "v*"
  workflow_dispatch: {}

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: macos-latest
            rust-target: x86_64-apple-darwin
            artifact: red-kv.darwin-x64.node

          - host: macos-latest
            rust-target: aarch64-apple-darwin
            artifact: red-kv.darwin-arm64.node

          - host: ubuntu-latest
            rust-target: x86_64-unknown-linux-gnu
            artifact: red-kv.linux-x64-gnu.node

          - host: ubuntu-latest
            rust-target: aarch64-unknown-linux-gnu
            artifact: red-kv.linux-arm64-gnu.node
            use-cross: true

          - host: windows-latest
            rust-target: x86_64-pc-windows-msvc
            artifact: red-kv.win32-x64-msvc.node

    runs-on: ${{ matrix.host }}
    defaults:
      run:
        working-directory: rust
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.95.0
          targets: ${{ matrix.rust-target }}

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version-file: rust/.bun-version

      - run: bun install

      - name: Install cross (linux-arm64 only)
        if: matrix.use-cross
        run: cargo install cross --git https://github.com/cross-rs/cross --rev 55f847251389c5406df85579191c0eac412fab3a

      - name: Build (napi build, native host)
        if: ${{ !matrix.use-cross }}
        run: bunx napi build --platform --release --target ${{ matrix.rust-target }} --dts ../ts/types.d.ts

      - name: Build (cross, for linux-arm64)
        if: matrix.use-cross
        run: |
          cross build --release --target ${{ matrix.rust-target }}
          cp target/${{ matrix.rust-target }}/release/libred_kv.so ./${{ matrix.artifact }}

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: rust/${{ matrix.artifact }}

  release:
    needs: build
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.node
