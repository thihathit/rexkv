name: publish-library

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Git tag (release) whose rexkv-ts.zip asset to publish"
        required: true

jobs:
  publish:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/setup-node@v2
        with:
          registry-url: https://registry.npmjs.org/
 
      - name: Download release asset
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release download "${{ inputs.tag }}" --repo "$GITHUB_REPOSITORY" --pattern "rexkv-ts.zip" --dir package

      - name: Publish to npm
        working-directory: package
        env:
          NODE_AUTH_TOKEN: ${{secrets.NPM_ACCESS_TOKEN}}
        run: |
          unzip -o rexkv-ts.zip
          npm publish
